<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Counterweight</title>
<!--
  Counterweight — drop coloured blocks on a balancing plank, melt groups of
  three, keep the whole thing from tipping over.
  Concept: Cédric Bernadac. Game made by Z-Code.
  Physics by Matter.js (MIT, inlined below with its license notice).
  Self-contained static file: no server, no external script, no assets.
-->
<style>
  :root {
    --ink: #2b2620;
    --cream: #f6ead4;
    --paper: #fbf3e2;
    --wood: #8a5a33;
    --wood-deep: #5d3a1f;
    --brick: #c14a2e;
    --leaf: #43a35f;
    --amber: #edb25e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--cream);
    color: var(--ink);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #cw-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: none; align-items: flex-start; justify-content: space-between;
    padding: max(8px, env(safe-area-inset-top)) 12px 0 12px;
    pointer-events: none; gap: 8px;
  }
  #hud.on { display: flex; }
  .hud-box {
    background: rgba(251, 243, 226, 0.82);
    border: 2px solid rgba(43, 38, 32, 0.85);
    border-radius: 12px;
    padding: 6px 12px;
    box-shadow: 0 2px 0 rgba(43, 38, 32, 0.25);
    line-height: 1.15;
  }
  .hud-score { font-size: 22px; font-weight: 800; letter-spacing: 0.5px; font-variant-numeric: tabular-nums; }
  .hud-best { font-size: 12px; opacity: 0.75; font-variant-numeric: tabular-nums; }
  .hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .hud-hearts { display: flex; gap: 4px; }
  .hud-hearts svg { width: 22px; height: 20px; }
  .hud-level { font-size: 13px; font-weight: 700; }
  .hud-perfect {
    font-size: 12px; font-weight: 700; color: var(--leaf);
    min-height: 15px; text-align: right;
  }
  #topbtns { position: fixed; top: max(8px, env(safe-area-inset-top)); right: 12px; display: flex; gap: 8px; z-index: 30; }
  #topbtns.hidden { display: none; }
  .icon-btn {
    pointer-events: auto;
    width: 40px; height: 40px; border-radius: 10px;
    border: 2px solid rgba(43, 38, 32, 0.85);
    background: rgba(251, 243, 226, 0.9);
    color: var(--ink); font-size: 18px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:active { transform: translateY(1px); }

  /* ---------- screens ---------- */
  .screen {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    background: rgba(43, 38, 32, 0.30);
    z-index: 20; padding: 20px;
  }
  .screen.on { display: flex; }
  .panel {
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 18px;
    box-shadow: 0 6px 0 rgba(43, 38, 32, 0.45);
    padding: 22px 26px;
    text-align: center;
    max-width: 420px; width: min(92vw, 420px);
    max-height: 88vh; overflow: auto;
  }
  h1 {
    font-size: clamp(30px, 8vw, 44px);
    letter-spacing: 0.12em; font-weight: 900;
    color: var(--ink); text-transform: uppercase;
  }
  h1 .tiltA { display: inline-block; transform: rotate(-8deg) translateY(-2px); color: var(--wood-deep); }
  h1 .tiltB { display: inline-block; transform: rotate(7deg) translateY(2px); color: var(--brick); }
  .tagline { margin-top: 6px; font-size: 15px; font-weight: 600; }
  .rule { margin-top: 10px; font-size: 13.5px; opacity: 0.85; line-height: 1.45; }
  .btn {
    margin-top: 14px; width: 100%;
    font: inherit; font-size: 19px; font-weight: 800; letter-spacing: 0.06em;
    color: var(--paper); background: var(--brick);
    border: 3px solid var(--ink); border-radius: 14px;
    padding: 12px 18px; cursor: pointer;
    box-shadow: 0 4px 0 rgba(43, 38, 32, 0.55);
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(43, 38, 32, 0.55); }
  .btn.secondary { background: var(--paper); color: var(--ink); font-size: 15px; padding: 9px 14px; }
  .opts { margin-top: 14px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .seg { display: flex; border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; background: var(--paper); }
  .seg button {
    font: inherit; font-size: 13px; font-weight: 700; border: 0; background: transparent;
    color: var(--ink); padding: 6px 10px; cursor: pointer;
  }
  .seg button.sel { background: var(--ink); color: var(--paper); }
  .over-title { font-size: clamp(24px, 6vw, 34px); font-weight: 900; letter-spacing: 0.08em; }
  .over-reason { margin-top: 4px; font-size: 14px; color: var(--brick); font-weight: 700; }
  .over-score { margin-top: 12px; font-size: 42px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
  .over-best { font-size: 14px; opacity: 0.8; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .over-best.newbest { color: var(--leaf); font-weight: 800; opacity: 1; }
  .over-chain { margin-top: 10px; font-size: 14px; font-weight: 600; }
  .over-chain b { color: var(--wood-deep); }
  .keys { margin-top: 14px; font-size: 12px; opacity: 0.65; line-height: 1.6; }
  kbd {
    border: 1.5px solid var(--ink); border-bottom-width: 3px; border-radius: 5px;
    padding: 0 5px; font-family: inherit; font-size: 11px; background: var(--paper);
  }
  #lang-note { position: fixed; bottom: max(8px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 11px; opacity: 0.5; pointer-events: none; }
</style>
</head>
<body>
<canvas id="cw-canvas"></canvas>

<div id="hud">
  <div class="hud-box">
    <div class="hud-score" id="hud-score">0</div>
    <div class="hud-best" id="hud-best"></div>
  </div>
  <div class="hud-right">
    <div class="hud-box hud-hearts" id="hud-hearts" aria-label="hearts"></div>
    <div class="hud-box hud-level" id="hud-level"></div>
    <div class="hud-perfect" id="hud-perfect"></div>
  </div>
</div>
<div id="topbtns">
  <button class="icon-btn" id="btn-pause" aria-label="pause" title="P">❚❚</button>
  <button class="icon-btn" id="btn-mute" aria-label="sound">♪</button>
</div>

<div class="screen on" id="scr-home">
  <div class="panel">
    <h1><span class="tiltA">Counter</span><span class="tiltB">weight</span></h1>
    <div class="tagline" id="t-tagline"></div>
    <div class="rule" id="t-rule"></div>
    <button class="btn" id="btn-play"></button>
    <div class="opts">
      <div class="seg" id="seg-lang"></div>
      <button class="icon-btn" id="btn-mute-home" aria-label="sound">♪</button>
      <button class="icon-btn" id="btn-reduce" aria-label="reduce motion" title="motion">≈</button>
    </div>
    <div class="keys" id="t-keys"></div>
  </div>
</div>

<div class="screen" id="scr-pause">
  <div class="panel">
    <div class="over-title" id="t-paused"></div>
    <button class="btn" id="btn-resume"></button>
    <button class="btn secondary" id="btn-restart"></button>
    <button class="btn secondary" id="btn-quit"></button>
    <div class="opts">
      <div class="seg" id="seg-lang-pause"></div>
      <button class="icon-btn" id="btn-mute-pause" aria-label="sound">♪</button>
      <button class="icon-btn" id="btn-reduce-pause" aria-label="reduce motion">≈</button>
    </div>
  </div>
</div>

<div class="screen" id="scr-over">
  <div class="panel">
    <div class="over-title" id="t-over"></div>
    <div class="over-reason" id="over-reason"></div>
    <div class="over-score" id="over-score">0</div>
    <div class="over-best" id="over-best"></div>
    <div class="over-chain" id="over-chain"></div>
    <button class="btn" id="btn-replay"></button>
    <button class="btn secondary" id="btn-menu"></button>
  </div>
</div>

// ===========================================================================
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

    var s = (typeof window !== 'undefined' && window.localStorage) || null;

      del: function (k) { try { if (s) s.removeItem(k); } catch (e) {} }

    return { get: function () { return null; }, set: function () {}, del: function () {} };

function makeRng(seed) {
  var s = (seed >>> 0) || 88675123;
  return function () {
    s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
}
// level → live parameters (linear ramp between start and ~6-minute targets)
function levelParams(level) {
  var P = SETTINGS.progress;
  var t = clamp((level - 1) / (P.rampLevels - 1), 0, 1);
  function ramp(pair) { return lerp(pair[0], pair[1], t); }
  return {
    level: level,
    autoDropMs: ramp(P.autoDropMs),
    colours: Math.round(ramp(P.colours)),
    leadChance: level >= P.leadFromLevel ? ramp(P.leadChance) : 0,
    balloonChance: level >= P.balloonFromLevel ? ramp(P.balloonChance) : 0,
    barChance: level >= P.barFromLevel ? ramp(P.barChance) : 0,
    plankScale: ramp(P.plankScale),
    wind: level >= P.windFromLevel
  };
}

// ===========================================================================

// ===========================================================================

  // its tilt integrates the torque of the blocks resting on it (their
  // weight × lever arm), with dead-zone friction, viscous damping and a
  // mechanical stop. A rigid pivot constraint would inject permanent
  // micro-jitter into every pile; this way piles truly settle and sleep.
  var plankKin = { theta: 0, omega: 0, torque: 0, inertia: 1 };

      M.Bodies.rectangle(pivot.x, pivot.y, len, S.plank.thickness, {}),
      M.Bodies.rectangle(pivot.x - len / 2, pivot.y - S.plank.thickness / 2 - S.plank.lipHeight / 2, 10, S.plank.lipHeight, {}),
      M.Bodies.rectangle(pivot.x + len / 2, pivot.y - S.plank.thickness / 2 - S.plank.lipHeight / 2, 10, S.plank.lipHeight, {})
    ];

      parts: parts,
      density: S.plank.density, isStatic: true,
      friction: S.plank.friction, frictionStatic: S.plank.frictionStatic,
      restitution: 0, slop: S.plank.slop,
      label: 'plank'

      levelFlash -= dt;
      var a = clamp(levelFlash / 0.6, 0, 1);
      ctx.globalAlpha = clamp(levelFlash > 1.2 ? (1.6 - levelFlash) / 0.4 : a, 0, 1) * 0.95;
      ctx.font = '900 26px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.strokeStyle = 'rgba(251,243,226,0.9)'; ctx.lineWidth = 6;
      ctx.strokeText(levelFlashText, view.worldW / 2, S.world.pivotY - 170);
      ctx.fillStyle = '#2b2620';
      ctx.fillText(levelFlashText, view.worldW / 2, S.world.pivotY - 170);
      ctx.globalAlpha = 1;
    }
    // heart flash on the frame
    if (heartFlash > 0) {
      heartFlash -= dt * 2.2;
      ctx.fillStyle = 'rgba(193, 74, 46, ' + clamp(heartFlash * 0.18, 0, 0.18) + ')';
      ctx.fillRect(0, 0, view.worldW, S.world.height);
    }
    if (plankShakeFlash > 0) plankShakeFlash -= dt;
  }
  function drawDebug(g) {
    if (!debug) return;
    var snap = g ? g.snapshot() : null;
    ctx.font = '12px ui-monospace, monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(251,243,226,0.85)';
    var x = 10, y = (state === 'playing' ? 96 : 30), line = 15;
    function row(s) { ctx.fillText(s, x, y); y += line; }
    if (snap) {
      row('fps ' + fpsAvg.toFixed(0));
      row('angle ' + snap.angleDeg.toFixed(1) + '°');
      row('torque ' + snap.torque.toFixed(1));
      row('level ' + snap.level + '  melts ' + snap.melts);
      row('bodies ' + snap.bodies + '  chain x' + snap.chain);
    } else row('fps ' + fpsAvg.toFixed(0));
  }

  // ----- main loop -----------------------------------------------------------
  function loop(ts) {
    requestAnimationFrame(loop);
    var dtMs = lastFrameTs ? (ts - lastFrameTs) : 16.7;
    lastFrameTs = ts;
    dtMs = clamp(dtMs, 0, 50);
    var dt = dtMs / 1000;
    fpsAvg = fpsAvg * 0.95 + (1000 / Math.max(dtMs, 1)) * 0.05;

    if (state === 'playing' && game) {
      keyMovePerFrame(dt);
      pollGamepad(dt);
      game.frame(dtMs);
      var snap = game.snapshot();
      el('hud-score').textContent = String(snap.score);
      var best = parseInt(store.get('cw.best') || '0', 10) || 0;
      el('hud-best').textContent = t('best') + ' ' + Math.max(best, snap.score);
      var perfEl = el('hud-perfect');
      if (snap.perfect.active && !snap.perfect.granted) perfEl.textContent = '⚖ ' + ((S.rules.perfect.afterMs - snap.perfect.ms) / 1000).toFixed(1) + 's';
      else if (snap.perfect.granted) perfEl.textContent = '⚖ ' + t('perfectKeep').replace('{n}', S.rules.perfect.extraBonus);
      else perfEl.textContent = '';
    } else if (state === 'menu') {
      stepAttract(dt);
    }
    if (state !== 'playing') AU.updateCreak(0, 0, 0);
    updateFx(dt);

    // render
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    // letterboxing: centre the world
    var drawW = view.worldW * view.scale, drawH = S.world.height * view.scale;
    view.offsetX = (view.w - drawW) / 2; view.offsetY = (view.h - drawH) / 2;
    var sx = 0, sy = 0;
    if (!reduceMotion && shake > 0.01) {
      sx = (Math.random() - 0.5) * shake * 10; sy = (Math.random() - 0.5) * shake * 10;
      shake *= Math.pow(0.0015, dt);
      if (plankShakeFlash > 0) shake = Math.max(shake, 0.5);
    }
    ctx.clearRect(0, 0, view.w, view.h);
    ctx.save();
    ctx.translate(view.offsetX + sx, view.offsetY + sy);
    ctx.scale(view.scale, view.scale);
    ctx.beginPath(); ctx.rect(0, 0, view.worldW, S.world.height); ctx.clip();

    var active = state === 'playing' ? game : attract;
    drawSky();
    if (active) {
      drawPivotStand(active._pivot);
      drawPlank(active);
      var bl = active._blocks;
      for (var i = 0; i < bl.length; i++) drawBlockBody(bl[i]);
      if (state === 'playing') {
        dropPreview(active);
        drawCursor(active, dt);
        drawOverlays(active, dt);
      }
    }
    drawFx(dt);
    ctx.restore();
    drawDebug(state === 'playing' ? game : null);
  }

  // ----- boot ----------------------------------------------------------------
  resize();
  updateMuteButtons(); updateReduceButtons();
  applyI18n();
  renderHearts(S.rules.hearts);
  startAttract();
  showScreen('scr-home');
  requestAnimationFrame(loop);
})(); // shell (browser only)
})(); // game-code IIFE
</script>
</body>
</html>
